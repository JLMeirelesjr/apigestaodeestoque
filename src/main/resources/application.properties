spring.application.name=apigestaodeestoque

# Coordenadas e Credenciais do PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/db_gestaoestoque
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8090

# Comportamento do Hibernate / JPA
# O valor 'update' garante que o Spring cria ou atualiza as tabelas, mas NUNCA apaga os dados ao reiniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Opcional: Mostra as queries SQL no terminal da IDE (excelente para aprendizagem e debug)
spring.jpa.show-sql=true
spring.jpa.format_sql=true
